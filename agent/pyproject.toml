[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nous-sync"
version = "1.0.0"
description = "Nous Sync: local folder agent for the Nous Drive index (metadata only)"
requires-python = ">=3.11"
dependencies = ["watchdog>=4", "httpx>=0.27"]

[project.optional-dependencies]
content = ["pypdf>=4", "python-docx>=1.1", "openpyxl>=3.1", "python-pptx>=0.6"]

[project.scripts]
nous-sync = "nous_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
