# Local/dev stack. In production point NOUS_DRIVE_DATABASE_URL at the Knowledge Base's Neon database
# (schema drive_index) and drop the `db` service.
services:
  db:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: nous }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  migrate:
    build: .
    command: ["migrate"]
    env_file: .env
    depends_on: [db]
  api:
    build: .
    command: ["serve", "--port", "8080"]
    env_file: .env
    ports: ["8080:8080"]
    depends_on: [migrate]
  worker:
    build: .
    command: ["worker"]
    env_file: .env
    depends_on: [migrate]
  mcp:
    build: .
    command: ["mcp", "--http", "--host", "0.0.0.0", "--port", "8090"]
    env_file: .env
    ports: ["8090:8090"]
    depends_on: [migrate]
volumes:
  pgdata:
