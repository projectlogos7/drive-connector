[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nous-drive"
version = "1.0.0"
description = "Nous Drive Connectors (Google Drive + local folders), live index in Postgres, and the Index MCP server"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "psycopg[binary]>=3.1",
  "psycopg_pool>=3.2",
  "httpx>=0.27",
  "cryptography>=42",
  "pydantic>=2.6",
  "mcp>=2.0",
]

[project.optional-dependencies]
content = ["fastembed>=0.4", "pypdf>=4", "python-docx>=1.1", "openpyxl>=3.1", "python-pptx>=0.6"]
claude = ["anthropic>=1.0"]  # only if SUMMARY_PROVIDER=claude
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
nous-drive = "nous_drive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nous_drive = ["migrations/*.sql", "api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests", "agent/tests"]
pythonpath = ["src", "agent/src"]
asyncio_default_fixture_loop_scope = "function"
